services:
  - type: web
    name: adaptivelearn-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true          # Render auto-generates a secure random value
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: DATABASE_URL
        value: sqlite:///./adaptive_learning.db
      - key: ALLOWED_ORIGINS
        value: https://adaptive-learning-platform.vercel.app
      - key: PYTHON_VERSION
        value: "3.11.0"
